[project]
name = "contract"
version = "1.0.0"
description = "Code generation with executable contracts using large language models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "icontract>=2.7.3",
    "jinja2>=3.1.6",
    "langchain>=1.3.11",
    "langchain-anthropic>=1.4.8",
    "langchain-core>=1.4.8",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.3.3",
    "matplotlib>=3.11.0",
    "pandas>=3.0.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "tqdm>=4.68.3",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "crosshair-tool==0.0.110",
    "hypothesis>=6.155.6",
    "isort>=8.0.1",
    "mutmut>=3.5.0",
    "z3-solver>=4.16.0.0",
]

[project.scripts]
contract = "contract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contract = ["agent/prompts/*/*.j2"]

[tool.uv.workspace]
members = []

[tool.black]
target-version = ["py312"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

